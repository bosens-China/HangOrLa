# 用于构建和部署 Vite 项目到 GitHub Pages 的示例工作流程
name: 部署 Vite 项目到 GitHub Pages

on:
  # 在针对默认分支的推送上运行
  push:
    branches: ['main']

  # 允许您从“Actions”选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一次并发部署，跳过在进行中和最新排队之间的运行队列。
# 但是，不要取消进行中的运行，因为我们希望允许这些生产部署完成。
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: 安装依赖
        run: pnpm install
      - name: 设置 Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: vite
      - name: 构建项目
        run: pnpm run build
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
